<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio ao Vivo | Sindicato</title>
    <meta name="description" content="Acompanhe ao vivo o sorteio oficial do Sindicato, com revelação do ganhador e do prêmio em tempo real.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --azul: #2f5fff;
            --texto: #05264d;
            --texto-suave: #2c4470;
            font-family: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden; /* nunca rola, independente da tela */
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #e7f3ff 0%, #cfe4fb 45%, #a9cff0 100%);
            color: var(--texto);
        }

        /* Layout ocupa a tela inteira, sem card/caixa central -- usa bem as laterais */
        #container {
            width: 100vw;
            height: 100vh;
            padding: 2vh 3vw;
            display: flex;
            flex-direction: column;
        }

        /* --- Header: logos nos dois cantos, telefones centralizados entre elas --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2vw;
        }

        .logo-lateral {
            width: clamp(360px, 13vh, 360px);
            height: auto;
            flex-shrink: 0;
        }

        /* --- Telefones: agora no topo, entre as duas logos, com efeito de "pop-up" pulsando --- */
        #aviso-contato {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1vh;
            background: rgba(255, 255, 255, 0.55);
            border: 2px solid rgba(192, 20, 60, 0.35);
            border-radius: 18px;
            padding: 1.4vh 1.6vw;
            animation: pulsar-aviso 2.2s ease-in-out infinite;
        }

        @keyframes pulsar-aviso {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(192, 20, 60, 0.25);
            }
            50% {
                transform: scale(1.025);
                box-shadow: 0 0 0 14px rgba(192, 20, 60, 0);
            }
        }

        .aviso-titulo {
            font-size: clamp(1.8em, 2.3vh, 1.3em);
            font-weight: 900;
            color: var(--texto);
            text-align: center;
            margin: 0;
        }

        .aviso-titulo strong { color: #c0143c; }

        .telefones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.6vw;
        }

        .telefone {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: clamp(1.15em, 2.6vh, 1.6em);
            color: var(--texto);
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(47, 95, 255, 0.35);
            border-radius: 12px;
            padding: 0.7vh 1.4vw;
            white-space: nowrap;
            box-shadow: 0 6px 14px -8px rgba(5, 38, 77, 0.25);
        }

        /* --- Main: prêmio à esquerda, sorteado à direita, descidos e bem grandes --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4vw;
            min-height: 0;
        }

        #coluna-premio {
            flex: 0 0 42%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
        }

        #premio-topo {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1.4vh;
        }

        #premio-topo.visivel { display: flex; }

        #premio-topo .rotulo {
            font-size: clamp(1.8em, 2.4vh, 1.4em);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--azul);
            margin: 0;
        }

        #premio-topo-imagem {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 42vh;
            border-radius: 20px;
            box-shadow: 0 16px 34px -12px rgba(5, 38, 77, 0.4);
            display: none;
            object-fit: contain;
        }

        #premio-topo-nome {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2em, 5.2vh, 3.2em);
            font-weight: 800;
            color: var(--texto);
            line-height: 1.15;
            margin: 0;
        }

        /* --- Coluna direita: revelação do sorteado --- */
        #coluna-sorteado {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.8em, 3.8vh, 2.3em);
            font-weight: 700;
            margin: 0 0 1vh;
            color: var(--texto);
        }

        #nome-publico {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.8em, 9vh, 5.2em);
            font-weight: 800;
            color: #c0143c;
            margin: 1vh 0;
            line-height: 1.08;
            text-shadow: 0 4px 14px rgba(192, 20, 60, 0.18);
        }

        /* --- Matrícula: agora em evidência, grande e vermelha --- */
        #matricula-publico {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.8em, 4.2vh, 2.4em);
            font-weight: 800;
            margin: 0.8vh 0;
            color: #c0143c;
        }

        /* CPF sobe um pouco, mas continua discreto -- não é o foco */
        #cpf-publico {
            font-size: clamp(1.4em, 2.4vh, 1.4em);
            margin-top: 0.4vh;
            color: var(--texto-suave);
        }

        .pulsando { animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 900px) {
            main { flex-direction: column; gap: 2vh; }
            #coluna-premio { flex: 0 0 auto; }
            header { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div id="container">
        <header>
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo do Sindicato" class="logo-lateral">

            <div id="aviso-contato">
                <p class="aviso-titulo">⏰ Sorteado(a) ausente? Ligue em até <strong>1 hora</strong> para retirar o prêmio! Caso o associado não entre em contato, haverá <strong>novo sorteio</strong>:</p>
                <div class="telefones">
                    <span class="telefone">📞 (21) 98900-1557</span>
                    <span class="telefone">📞 (21) 99280-5710</span>
                    <span class="telefone">📞 (21) 99284-0644</span>
                </div>
            </div>

            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo do Sindicato" class="logo-lateral">
        </header>

        <main>
            <div id="coluna-premio">
                <div id="premio-topo">
                    <p class="rotulo">🎁 Prêmio desta rodada</p>
                    <img id="premio-topo-imagem" alt="Imagem do prêmio">
                    <p id="premio-topo-nome"></p>
                </div>
            </div>

            <div id="coluna-sorteado">
                <h1>O grande sorteado(a) é...</h1>
                <p id="nome-publico" aria-live="polite">Aguardando<br>sorteio...</p>
                <p id="matricula-publico"></p>
                <p id="cpf-publico"></p>
            </div>
        </main>
    </div>

    <audio id="somSorteio" src="{{ url_for('static', filename='som_sorteio.mp3') }}" preload="auto"></audio>

    <script>
        // Duração do suspense (som + espera antes de revelar o nome), em milissegundos
        const DURACAO_SUSPENSE_MS = 4000;

        let suspenseTimeoutId = null;
        let pulseTimeoutId = null;

        function mostrarPremioTopo(nome, imagem) {
            const bloco = document.getElementById('premio-topo');
            const nomeEl = document.getElementById('premio-topo-nome');
            const imagemEl = document.getElementById('premio-topo-imagem');

            if (!nome) {
                bloco.classList.remove('visivel');
                return;
            }

            bloco.classList.add('visivel');
            nomeEl.textContent = nome;
            if (imagem) {
                imagemEl.src = imagem;
                imagemEl.style.display = 'block';
            } else {
                imagemEl.style.display = 'none';
            }
        }

        // Ao clicar em "Definir Prêmio" no painel do operador, atualiza aqui em tempo real
        function tratarPremioDefinido() {
            const nome = localStorage.getItem('premio_definido_nome');
            const imagem = localStorage.getItem('premio_definido_imagem');
            mostrarPremioTopo(nome, imagem);
        }

        // Ao iniciar uma nova rodada, tira o ganhador anterior da tela e volta à frase padrão
        function resetarSorteado() {
            clearTimeout(suspenseTimeoutId);
            clearTimeout(pulseTimeoutId);

            const nomeEl = document.getElementById('nome-publico');
            const somSorteio = document.getElementById('somSorteio');

            somSorteio.pause();
            somSorteio.currentTime = 0;

            nomeEl.classList.remove('pulsando');
            nomeEl.innerHTML = 'Aguardando<br>sorteio...';
            document.getElementById('matricula-publico').textContent = '';
            document.getElementById('cpf-publico').textContent = '';
        }

        function fazerRevelacao() {
            const nome = localStorage.getItem('sorteado_nome');
            const matricula = localStorage.getItem('sorteado_matricula');
            const cpfPublico = localStorage.getItem('sorteado_cpf_publico');

            if (!nome || !matricula) return;

            const nomeEl = document.getElementById('nome-publico');
            const matriculaEl = document.getElementById('matricula-publico');
            const cpfEl = document.getElementById('cpf-publico');
            const somSorteio = document.getElementById('somSorteio');

            somSorteio.pause();
            somSorteio.currentTime = 0;
            nomeEl.classList.remove('pulsando');

            nomeEl.classList.add('pulsando');
            nomeEl.textContent = '.........';
            matriculaEl.textContent = '';
            cpfEl.textContent = '';

            somSorteio.play().catch(err => console.warn('Erro ao tocar som:', err));

            clearTimeout(suspenseTimeoutId);
            clearTimeout(pulseTimeoutId);

            suspenseTimeoutId = setTimeout(() => {
                somSorteio.pause();
                somSorteio.currentTime = 0;

                nomeEl.textContent = nome;
                nomeEl.classList.add('pulsando');
                matriculaEl.textContent = `Matrícula: ${matricula}`;
                if (cpfPublico) cpfEl.textContent = `CPF: ${cpfPublico}`;

                confetti({ particleCount: 220, spread: 100, origin: { y: 0.6 } });

                pulseTimeoutId = setTimeout(() => nomeEl.classList.remove('pulsando'), 2000);
            }, DURACAO_SUSPENSE_MS);
        }

        // Escuta mudanças feitas pelo operador em outra aba/janela
        window.addEventListener('storage', (event) => {
            if (event.key === 'premio_definido_ts') tratarPremioDefinido();
            if (event.key === 'sorteado_ts') fazerRevelacao();
            if (event.key === 'resetar_sorteado_ts') resetarSorteado();
        });

        // Ao abrir/recarregar o telão, busca o prêmio já selecionado no servidor
        fetch('/premio-atual')
            .then(response => response.json())
            .then(data => mostrarPremioTopo(data.premio.nome, data.premio.imagem))
            .catch(() => {});

        localStorage.removeItem('sorteado_nome');
        localStorage.removeItem('sorteado_matricula');
        localStorage.removeItem('sorteado_cpf_publico');
        localStorage.removeItem('sorteado_premio_nome');
        localStorage.removeItem('sorteado_premio_imagem');
    </script>
</body>
</html>
